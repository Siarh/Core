name: Temporary screenshot handoff

on:
  push:
    branches: [build28-source]
    paths:
      - ".github/workflows/temp-screenshot-handoff.yml"

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout screenshot from main without modifying it
        uses: actions/checkout@v4
        with:
          repository: Siarh/Core
          ref: main
          path: screenshot-source
      - name: Stage screenshot
        run: |
          mkdir -p handoff
          cp "screenshot-source/Снимок экрана (514).png" handoff/screenshot-514.png
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-514-for-review
          path: handoff/screenshot-514.png
          if-no-files-found: error
          retention-days: 1
