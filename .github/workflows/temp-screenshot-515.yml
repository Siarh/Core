name: Temporary screenshot 515 handoff

on:
  push:
    branches: [build28-source]
    paths:
      - ".github/workflows/temp-screenshot-515.yml"

jobs:
  handoff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout screenshot from main
        uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            Снимок экрана (515).png
          sparse-checkout-cone-mode: false
      - name: Upload screenshot
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-515-for-review
          path: Снимок экрана (515).png
          if-no-files-found: error
          retention-days: 1
